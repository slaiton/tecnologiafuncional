name: tf-Front

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Compila y pre-renderiza las páginas (HTML por ruta + sitemap.xml)
      - name: Build
        run: npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Si existe el secret SSH_KNOWN_HOSTS se usa (recomendado); si no, se consulta
      # la huella del servidor con ssh-keyscan mostrando el motivo si falla.
      - name: Add server to known_hosts
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
            exit 0
          fi
          if [ -z "$HOST" ] || [[ "$HOST" =~ [@:/[:space:]] ]]; then
            echo "::error::SERVER_HOST está vacío o mal formado. Debe ser solo el dominio o la IP (sin usuario@, puerto, https:// ni espacios)."
            exit 1
          fi
          if ! timeout 15 bash -c "echo > /dev/tcp/$HOST/22" 2>/dev/null; then
            echo "::error::No hay conexión al puerto 22 de SERVER_HOST desde GitHub Actions. Revisa el Security Group de AWS o el firewall del servidor."
            exit 1
          fi
          ssh-keyscan -T 15 -p 22 -H "$HOST" >> ~/.ssh/known_hosts

      # dist/* no incluye archivos ocultos, por eso .htaccess se copia aparte
      - name: Deploy via SCP
        run: |
          scp -r -P 22 dist/* ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/var/www/html/apps/tf
          scp -P 22 dist/.htaccess ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/var/www/html/apps/tf/.htaccess
